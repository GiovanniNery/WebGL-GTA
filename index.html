        <script>
            function start(){

                var stats = new Stats();

                // Align top-left
                stats.domElement.style.position = 'absolute';
                stats.domElement.style.left = '0px';
                stats.domElement.style.top = '0px';

                document.body.appendChild( stats.domElement );

                setInterval( function () {

                    stats.update();

                }, 1000 / 60 );

                // Exposto globalmente para controle direto pelo joystick mobile
                window._gtaGame = new GTA.Game();
            }

        </script>
        <style>
            body, html {
                overflow:hidden;
                margin:0;
                padding:0;
                background:#000;
            }

            #GTADebugPositionData {
                position: absolute;
                right: 0px;
                top: 0px;

            /* Aviso de rotação em portrait */

    <body onload="start();">

<!-- Aviso de rotação -->
<div id="_rotMsg">

<script src="js/ai.js"></script>
<script>
(function(){
var s=document.createElement('style');
s.textContent='canvas{position:fixed!important;top:50%!important;left:50%!important;transform:translate(-50%,-50%)!important;width:auto!important;height:100vh!important;max-width:100vw!important}#mc{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;pointer-events:none}#jbase{position:absolute;left:20px;bottom:20px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35);pointer-events:all}#jthumb{position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.75);transform:translate(-50%,-50%);pointer-events:none;transition:transform .05s}#ab{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;gap:14px;pointer-events:all}.ab{width:68px;height:68px;border-radius:50%;background:rgba(200,20,20,.7);border:2px solid rgba(255,100,100,.5);color:#fff;font-family:monospace;font-size:9px;font-weight:bold;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;user-select:none}.ab:active{background:rgba(255,200,0,.8)}#ab2{background:rgba(20,20,200,.7);border-color:rgba(100,100,255,.5)}';
document.head.appendChild(s);
document.body.insertAdjacentHTML('beforeend','<div id="mc"><div id="jbase"><div id="jthumb"></div></div><div id="ab"><div class="ab" id="ab1">ENTRAR<br>CARRO</div><div class="ab" id="ab2">AÇÃO</div></div></div>');

// Solicita orientação landscape
if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(function(){});
}

// Helpers para acessar o player diretamente (mais confiável que KeyboardEvent em mobile)
function getPlayer() {
    return window._gtaGame && window._gtaGame.player;
}
function setMove(flag, on) {
    var p = getPlayer();
    if (!p) return;
    p[flag] = on;
}
function releaseAll() {
    ['moveForward','moveBackward','turnLeft','turnRight'].forEach(function(f){
        setMove(f, false);
    });
}

var jActive=false,jBX=0,jBY=0,JR=54;
var jbase=document.getElementById('jbase');
var thumb=document.getElementById('jthumb');

jbase.addEventListener('touchstart',function(e){
  e.preventDefault();
  jActive=true;
  var t=e.touches[0];
  var br=jbase.getBoundingClientRect();
  jBX=br.left+br.width/2;jBY=br.top+br.height/2;
  updateJoy(t.clientX,t.clientY);
},{passive:false});

jbase.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(!jActive)return;
  updateJoy(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});

jbase.addEventListener('touchend',function(e){
  e.preventDefault();
  jActive=false;
  thumb.style.transform='translate(-50%,-50%)';
  releaseAll();
},{passive:false});

function updateJoy(cx,cy){
  var dx=cx-jBX,dy=cy-jBY;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>JR){dx=dx/dist*JR;dy=dy/dist*JR;}
  thumb.style.transform='translate(calc(-50% + '+Math.round(dx)+'px),calc(-50% + '+Math.round(dy)+'px))';
  var th=JR*0.3;
  setMove('moveForward',  dy < -th);
  setMove('moveBackward', dy >  th);
  setMove('turnLeft',     dx < -th);
  setMove('turnRight',    dx >  th);
}

// Botão ENTRAR CARRO
document.getElementById('ab1').addEventListener('touchstart',function(e){
  e.preventDefault();
  var p = getPlayer();
  if (p && typeof p.toggleCar === 'function') p.toggleCar();
},{passive:false});
document.getElementById('ab1').addEventListener('touchend',function(e){e.preventDefault();},{passive:false});

// Botão AÇÃO (reservado)
document.getElementById('ab2').addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});
document.getElementById('ab2').addEventListener('touchend',function(e){e.preventDefault();},{passive:false});

document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
})();
</script>

</html>
