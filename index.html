    <head>
        <title>ATG1</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        <script src="external/ThreeDebug.js"></script>

        <script src="external/Box2dWeb-2.1.a.3.js"></script>

        <script src="js/reader.js"></script>

        <script src="js/missionactions.js"></script>

        <script>
            function start() {
                var stats = new Stats();
                stats.domElement.style.position = 'absolute';
                stats.domElement.style.left = '0px';
                stats.domElement.style.top = '0px';
                document.body.appendChild(stats.domElement);
                setInterval(function() { stats.update(); }, 1000 / 60);
                window._gtaGame = new GTA.Game();
            }
        </script>

        <style>
            body, html { overflow:hidden; margin:0; padding:0; background:#000; }
            #GTADebugPositionData { position:absolute; right:0; top:0; width:200px; height:50px; opacity:0.5; color:#fff; background:#000; }
            #_rotMsg {
                display:none; position:fixed; top:0; left:0; width:100%; height:100%;
                background:#000; z-index:9999999; align-items:center; justify-content:center;
                color:#fff; font-size:22px; text-align:center; font-family:sans-serif;
                flex-direction:column; gap:16px;
            }
            @media (orientation:portrait) {
                #_rotMsg { display:flex!important; }
                canvas, #mc { display:none!important; }
            }
            @keyframes flashTiro { 0%{opacity:1} 100%{opacity:0} }
            @keyframes sirenePisca {
                0%   { background:rgba(255,0,0,0.18); }
                50%  { background:rgba(0,0,0,0); }
                100% { background:rgba(0,0,255,0.18); }
            }
            @keyframes notificFade {
                0%  { opacity:1; transform:translateX(-50%) translateY(0); }
                70% { opacity:1; transform:translateX(-50%) translateY(0); }
                100%{ opacity:0; transform:translateX(-50%) translateY(-20px); }
            }
        </style>
    </head>
    <body>

<div id="_menu" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;">
    <div style="color:#cc0000;font-family:'Courier New',monospace;font-size:72px;font-weight:900;letter-spacing:8px;text-shadow:3px 3px 0 #440000,0 0 60px #ff0000;">ATG1</div>
    <div style="color:#555;font-family:'Courier New',monospace;font-size:10px;text-align:center;line-height:2.4;letter-spacing:2px;">
        JOYSTICK ESQUERDO &mdash; MOVER / GIRAR<br>
        ENTRAR CARRO &mdash; ENTRAR / SAIR DO VEICULO<br>
        ACAO &mdash; ATIRAR / SIRENE NO CARRO<br>
        DERRAPAR &mdash; FREAR E DERRAPAR (ESPACO NO TECLADO)
    </div>
    <button id="_playBtn" style="margin-top:12px;padding:16px 56px;background:#cc0000;color:#fff;border:2px solid #ff4444;border-radius:0;font-size:15px;font-family:'Courier New',monospace;font-weight:bold;cursor:pointer;letter-spacing:4px;">JOGAR</button>
</div>

<div id="_rotMsg">
    <div style="font-size:48px">&#8635;</div>
    <div>Gire o dispositivo<br>para jogar na horizontal</div>
</div>

<div id="_loading" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99997;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
    <div style="color:#cc0000;font-family:'Courier New',monospace;font-size:28px;font-weight:900;letter-spacing:6px;">ATG1</div>
    <div style="color:#aaa;font-family:sans-serif;font-size:14px;">Carregando...</div>
    <div style="width:120px;height:4px;background:#333;border-radius:2px;overflow:hidden;">
        <div id="_loadBar" style="height:100%;width:0%;background:#e55;border-radius:2px;animation:ldpulse 1.5s ease-in-out infinite;"></div>
    </div>
    <style>@keyframes ldpulse{0%,100%{width:20%}50%{width:80%}}</style>
</div>

<div id="_hud" style="display:none;position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:99990;font-family:'Courier New',monospace;">
    <div style="position:absolute;top:6px;left:8px;display:flex;flex-direction:column;gap:2px;">
        <div id="_dinheiro" style="color:#fff;font-size:15px;font-weight:bold;text-shadow:1px 1px 2px #000,0 0 6px #000;">$0</div>
        <div id="_armaHud" style="color:#fc0;font-size:9px;letter-spacing:1px;text-shadow:1px 1px 2px #000;"></div>
    </div>
    <div style="position:absolute;top:6px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
        <div id="_estrelas" style="font-size:16px;color:#444;letter-spacing:3px;text-shadow:1px 1px 2px #000;">&#9734;&#9734;&#9734;&#9734;&#9734;</div>
        <div id="_procuradoTxt" style="color:#888;font-size:8px;letter-spacing:1px;"></div>
    </div>
</div>

<div id="_notific" style="display:none;position:fixed;top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fc0;font-family:'Courier New',monospace;font-size:11px;font-weight:bold;letter-spacing:2px;padding:6px 16px;border:1px solid #fc0;pointer-events:none;z-index:99995;white-space:nowrap;"></div>

<div id="_sirene" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99988;animation:sirenePisca 0.4s linear infinite;"></div>
<div id="_flash" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99989;background:rgba(255,230,80,0.35);animation:flashTiro 0.15s ease-out forwards;"></div>

</body>
<script src="js/ai.js"></script>
<script>
(function(){

var s = document.createElement('style');
s.textContent =
    'canvas{position:fixed!important;top:50%!important;left:50%!important;transform:translate(-50%,-50%)!important;width:auto!important;height:100vh!important;max-width:100vw!important}' +
    '#mc{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99992;pointer-events:none}' +
    '#jbase{position:absolute;left:20px;bottom:20px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35);pointer-events:all}' +
    '#jthumb{position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.75);transform:translate(-50%,-50%);pointer-events:none;transition:transform .05s}' +
    '#ab{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;pointer-events:all}' +
    '.ab{width:64px;height:64px;border-radius:50%;color:#fff;font-family:monospace;font-size:8px;font-weight:bold;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;user-select:none;-webkit-user-select:none}' +
    '.ab:active{background:rgba(255,200,0,.85)!important}' +
    '#ab1{background:rgba(200,20,20,.75);border:2px solid rgba(255,100,100,.5)}' +
    '#ab2{background:rgba(20,130,20,.75);border:2px solid rgba(80,255,80,.5)}' +
    '#ab3{background:rgba(150,100,20,.75);border:2px solid rgba(255,200,80,.5)}';
document.head.appendChild(s);

document.body.insertAdjacentHTML('beforeend',
    '<div id="mc" style="display:none">' +
        '<div id="jbase"><div id="jthumb"></div></div>' +
        '<div id="ab">' +
            '<div class="ab" id="ab1">ENTRAR<br>CARRO</div>' +
            '<div class="ab" id="ab2">ACAO</div>' +
            '<div class="ab" id="ab3">DERRAPAR</div>' +
        '</div>' +
    '</div>'
);

function getPlayer() { return window._gtaGame && window._gtaGame.player; }
function setMove(flag, on) { var p = getPlayer(); if (p) p[flag] = on; }
function liberarMovimento() {
    ['moveForward','moveBackward','turnLeft','turnRight'].forEach(function(f){ setMove(f,false); });
}

var GTA_dinheiro  = 0;
var GTA_procurado = 0;
var TEXTOS_PROCURADO = ['','PROCURADO','MUITO PROCURADO','FUGITIVO','PERIGOSO','INIMIGO PUBLICO'];
var NOMES_ARMA       = ['','PISTOLA','METRALHADORA'];

function atualizarHUD() {
    var p   = getPlayer();
    var elD = document.getElementById('_dinheiro');
    var elE = document.getElementById('_estrelas');
    var elT = document.getElementById('_procuradoTxt');
    var elA = document.getElementById('_armaHud');
    if (elD) elD.textContent = '$' + GTA_dinheiro;
    if (elE) {
        var txt = '';
        for (var i=0;i<GTA_procurado;i++) txt += '&#9733;';
        for (var i=GTA_procurado;i<5;i++) txt += '&#9734;';
        elE.innerHTML = txt;
        elE.style.color = GTA_procurado>0 ? (GTA_procurado>=4?'#f44':'#ff0') : '#444';
    }
    if (elT) elT.textContent = TEXTOS_PROCURADO[GTA_procurado] || '';
    if (elA && p) {
        var w = p.weapon || 0;
        elA.textContent = w > 0 ? (NOMES_ARMA[w] || '') : '';
        elA.style.color = w===2 ? '#f80' : '#fc0';
    }
}

function adicionarDinheiro(valor) { GTA_dinheiro += valor; atualizarHUD(); }

var GTA_roubosCarros = [];
var GTA_timerFuga    = 0;
var GTA_ultimoT      = performance.now();
var GTA_sireneLig    = false;

function registrarRoubo() {
    var agora = Date.now();
    GTA_roubosCarros.push(agora);
    GTA_roubosCarros = GTA_roubosCarros.filter(function(t){ return agora-t < 120000; });
    if (GTA_roubosCarros.length === 3) {
        GTA_procurado = Math.min(5, GTA_procurado + 1);
        GTA_timerFuga = 0;
        mostrarNotificacao('POLICIA AVISO!');
        atualizarHUD();
    } else if (GTA_roubosCarros.length > 3) {
        GTA_procurado = Math.min(5, GTA_procurado + 1);
        GTA_timerFuga = 0;
        atualizarHUD();
    }
}

function loopProcurado() {
    var agora = performance.now();
    var delta = (agora - GTA_ultimoT) / 1000;
    GTA_ultimoT = agora;
    if (GTA_procurado > 0) {
        var p = getPlayer();
        if (!(p && p.inCar)) {
            GTA_timerFuga += delta;
            var tDecair = 15 + GTA_procurado * 10;
            if (GTA_timerFuga >= tDecair) {
                GTA_timerFuga = 0;
                GTA_procurado = Math.max(0, GTA_procurado - 1);
                atualizarHUD();
                if (GTA_procurado === 0) mostrarNotificacao('FORA DE PERIGO');
            }
        } else {
            GTA_timerFuga = 0;
        }
    }
    requestAnimationFrame(loopProcurado);
}

window.GTA_onEnterCar = function(carro) { registrarRoubo(); };
window.GTA_onExitCar  = function() { if (GTA_sireneLig) toggleSirene(); };

var _notificTimer = null;
function mostrarNotificacao(txt) {
    var el = document.getElementById('_notific');
    if (!el) return;
    el.textContent = txt;
    el.style.display = 'block';
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = 'notificFade 2.5s ease-out forwards';
    if (_notificTimer) clearTimeout(_notificTimer);
    _notificTimer = setTimeout(function(){ el.style.display='none'; }, 2600);
}

var _flashTimer    = null;
var _metralhaTimer = null;
var _metralhaHold  = false;

function mostrarFlash() {
    var flash = document.getElementById('_flash');
    if (!flash) return;
    flash.style.display = 'block';
    flash.style.animation = 'none';
    flash.offsetHeight;
    flash.style.animation = 'flashTiro 0.12s ease-out forwards';
    if (_flashTimer) clearTimeout(_flashTimer);
    _flashTimer = setTimeout(function(){ flash.style.display='none'; }, 150);
}

function dispararArma() {
    var p = getPlayer();
    if (!p || p.inCar) return;
    mostrarFlash();
}

function iniciarMetralhadora() {
    if (_metralhaHold) return;
    _metralhaHold = true;
    function tiro() {
        if (!_metralhaHold) return;
        dispararArma();
        _metralhaTimer = setTimeout(tiro, 100);
    }
    tiro();
}

function pararMetralhadora() {
    _metralhaHold = false;
    if (_metralhaTimer) clearTimeout(_metralhaTimer);
}

function acaoBotaoPress() {
    var p = getPlayer();
    if (!p) return;
    if (p.inCar) {
        toggleSirene();
    } else if (p.weapon === 2) {
        iniciarMetralhadora();
    } else {
        dispararArma();
    }
}

function acaoBotaoRelease() { pararMetralhadora(); }

function toggleSirene() {
    GTA_sireneLig = !GTA_sireneLig;
    var sir = document.getElementById('_sirene');
    var btn = document.getElementById('ab2');
    if (sir) sir.style.display = GTA_sireneLig ? 'block' : 'none';
    if (btn) btn.style.background = GTA_sireneLig ? 'rgba(0,80,200,.85)' : 'rgba(20,130,20,.75)';
}

var GTA_pickups = [];
var GTA_PICKUP_POS = [
    {x:258, y:207},
    {x:348, y:253},
    {x:228, y:316},
];

function criarPickups(game) {
    if (!game || !game.scene) return;
    GTA_PICKUP_POS.forEach(function(pos) {
        try {
            var geom = new THREE.BoxGeometry(5,5,5);
            var mat  = new THREE.MeshBasicMaterial({color:0xffcc00, wireframe:true});
            var mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(pos.x, pos.y, 8);
            game.scene.add(mesh);
            GTA_pickups.push({mesh:mesh, pos:pos, ativa:true});
        } catch(e) { GTA.Log('Pickup error: '+e.message); }
    });
}

function loopPickups() {
    var p = getPlayer();
    var t = Date.now() * 0.003;
    GTA_pickups.forEach(function(pk) {
        if (!pk.ativa) return;
        pk.mesh.rotation.x += 0.04;
        pk.mesh.rotation.z += 0.03;
        pk.mesh.position.z  = 8 + Math.sin(t) * 3;
        if (!p) return;
        var dx   = p.position.x - pk.pos.x;
        var dy   = p.position.y - pk.pos.y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < 18) {
            pk.ativa = false;
            if (window._gtaGame) window._gtaGame.scene.remove(pk.mesh);
            p.weapon = 2;
            mostrarNotificacao('METRALHADORA OBTIDA!');
            atualizarHUD();
        }
    });
    requestAnimationFrame(loopPickups);
}

function iniciarJogo() {
    document.getElementById('_menu').style.display = 'none';
    document.getElementById('mc').style.display    = 'block';
    document.getElementById('_hud').style.display  = 'block';
    atualizarHUD();
    start();
    loopProcurado();
    setTimeout(function tentarPickups() {
        var g = window._gtaGame;
        if (!g || !g.scene) { setTimeout(tentarPickups, 500); return; }
        criarPickups(g);
        loopPickups();
    }, 3000);
}

document.getElementById('_playBtn').addEventListener('touchstart',function(e){e.preventDefault();iniciarJogo();},{passive:false});
document.getElementById('_playBtn').addEventListener('click',iniciarJogo);

if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});

var jAtivo=false,jBX=0,jBY=0,JR=54;
var jbase=document.getElementById('jbase');
var thumb=document.getElementById('jthumb');

jbase.addEventListener('touchstart',function(e){
    e.preventDefault(); jAtivo=true;
    var t=e.touches[0],br=jbase.getBoundingClientRect();
    jBX=br.left+br.width/2; jBY=br.top+br.height/2;
    moverJoy(t.clientX,t.clientY);
},{passive:false});
jbase.addEventListener('touchmove',function(e){
    e.preventDefault(); if(!jAtivo)return; moverJoy(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
jbase.addEventListener('touchend',function(e){
    e.preventDefault(); jAtivo=false; thumb.style.transform='translate(-50%,-50%)'; liberarMovimento();
},{passive:false});

function moverJoy(cx,cy){
    var dx=cx-jBX,dy=cy-jBY,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>JR){dx=dx/dist*JR;dy=dy/dist*JR;}
    thumb.style.transform='translate(calc(-50% + '+Math.round(dx)+'px),calc(-50% + '+Math.round(dy)+'px))';
    var th=JR*0.3;
    setMove('moveForward',dy<-th); setMove('moveBackward',dy>th);
    setMove('turnLeft',dx<-th);    setMove('turnRight',dx>th);
}

document.getElementById('ab1').addEventListener('touchstart',function(e){
    e.preventDefault();
    var p=getPlayer();
    if(p && typeof p.toggleCar==='function') p.toggleCar();
},{passive:false});
document.getElementById('ab1').addEventListener('touchend',function(e){e.preventDefault();},{passive:false});

document.getElementById('ab2').addEventListener('touchstart',function(e){e.preventDefault();acaoBotaoPress();},{passive:false});
document.getElementById('ab2').addEventListener('touchend',function(e){e.preventDefault();acaoBotaoRelease();},{passive:false});

document.getElementById('ab3').addEventListener('touchstart',function(e){e.preventDefault();setMove('handbrake',true);},{passive:false});
document.getElementById('ab3').addEventListener('touchend',function(e){e.preventDefault();setMove('handbrake',false);},{passive:false});

document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

})();
</script>

</html>
