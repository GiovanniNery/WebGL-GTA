<script>
(function(){

/* ââ Estilos dos controles mobile âââââââââââââââââââââââââââââ */
var s = document.createElement('style');
s.textContent =
    'canvas{position:fixed!important;top:50%!important;left:50%!important;transform:translate(-50%,-50%)!important;width:auto!important;height:100vh!important;max-width:100vw!important}' +
    '#mc{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99992;pointer-events:none}' +

    '#jthumb{position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.75);transform:translate(-50%,-50%);pointer-events:none;transition:transform .05s}' +
    '#ab{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;pointer-events:all}' +
    '.ab{width:64px;height:64px;border-radius:50%;color:#fff;font-family:monospace;font-size:8px;font-weight:bold;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;user-select:none;-webkit-user-select:none}' +
    '.ab:active{background:rgba(255,200,0,.85)!important}' +
    '#ab1{background:rgba(200,20,20,.75);border:2px solid rgba(255,100,100,.5)}' +
    '#ab2{background:rgba(20,130,20,.75);border:2px solid rgba(80,255,80,.5)}' +
    '#ab3{background:rgba(150,100,20,.75);border:2px solid rgba(255,200,80,.5)}';
document.head.appendChild(s);

document.body.insertAdjacentHTML('beforeend',
    '<div id="mc" style="display:none">' +
        '<div id="jbase"><div id="jthumb"></div></div>' +
        '<div id="ab">' +
            '<div class="ab" id="ab1">ENTRAR<br>CARRO</div>' +
            '<div class="ab" id="ab2">ACAO</div>' +
            '<div class="ab" id="ab3">DERRAPAR</div>' +
        '</div>' +
    '</div>'
);

/* ââ Helpers ââââââââââââââââââââââââââââââââââââââââââââââââââ */
function getPlayer() { return window._gtaGame && window._gtaGame.player; }
function setMove(flag, on) { var p = getPlayer(); if (p) p[flag] = on; }
function liberarMovimento() {
    ['moveForward','moveBackward','turnLeft','turnRight'].forEach(function(f){ setMove(f,false); });
}

/* ââ Sistema HUD ââââââââââââââââââââââââââââââââââââââââââââââ */
var GTA_dinheiro  = 0;
var GTA_procurado = 0;   // 0-5 estrelas
var GTA_health    = 5;   // 5 coracoes (como Health.cs GTA2_Unity)
// Municao por arma (como ArmouryPlayer.cs: weapons[].CurrentAmmo)
// Pistola = max 99, Metralhadora = max 99
var GTA_ammo = { 1: 0, 2: 0 };

var TEXTOS_PROCURADO = ['','PROCURADO','MUITO PROCURADO','FUGITIVO','PERIGOSO','INIMIGO PUBLICO'];
var NOMES_ARMA       = ['', 'PISTOLA .38', 'METRALHADORA'];
var CORES_ARMA       = ['', '#fc0', '#f80'];

function atualizarHUD() {
    var p   = getPlayer();
    var elD = document.getElementById('_dinheiro');
    var elE = document.getElementById('_estrelas');
    var elT = document.getElementById('_procuradoTxt');
    var elA = document.getElementById('_armaHud');
    var elM = document.getElementById('_ammoHud');
    var elI = document.getElementById('_armaIcone');
    var elV = document.getElementById('_vidaHud');

    if (elD) elD.textContent = '$' + GTA_dinheiro;

    // Saude: 5 coracoes (cheios/vazios como GTA2_Unity Health.cs)
    if (elV) {
        var corVida = '';
        for (var h = 0; h < 5; h++) {
            corVida += h < GTA_health ? '&#10084;' : '&#9825;';
        }
        elV.innerHTML = corVida;
        elV.style.color = GTA_health <= 1 ? '#f44' : (GTA_health <= 3 ? '#fa4' : '#f44');
    }

    // Estrelas de procurado
    if (elE) {
        var txt = '';
        for (var i = 0; i < GTA_procurado; i++) txt += '&#9733;';
        for (var i = GTA_procurado; i < 5; i++) txt += '&#9734;';
        elE.innerHTML = txt;
        elE.style.color = GTA_procurado > 0 ? (GTA_procurado >= 4 ? '#f44' : '#ff0') : '#444';
    }

    if (elT) elT.textContent = TEXTOS_PROCURADO[GTA_procurado] || '';

    // Arma + municao (como ArmouryPlayer: WeaponChanged(icon, ammo))
    if (p) {
        var w = p.weapon || 0;
        if (elA) {
            elA.textContent = w > 0 ? NOMES_ARMA[w] || '' : '';
            elA.style.color = w > 0 ? CORES_ARMA[w] : '#fc0';
        }
        if (elM) {
            if (w > 0 && GTA_ammo[w] !== undefined) {
                elM.textContent = '[' + GTA_ammo[w] + ']';
                elM.style.color = GTA_ammo[w] <= 5 ? '#f44' : '#fff';
            } else {
                elM.textContent = '';
            }
        }
        if (elI) {
            if (w > 0) {
                elI.style.display = 'inline-block';
                elI.style.borderColor = CORES_ARMA[w];
                elI.style.background = w === 2 ? 'rgba(255,136,0,0.3)' : 'rgba(255,204,0,0.3)';
            } else {
                elI.style.display = 'none';
            }
        }
    }
}

function adicionarDinheiro(valor) {
    GTA_dinheiro += valor;
    atualizarHUD();
}

/* Player morreu (carro explodiu com ele dentro) — chamado por ai.js GTA._killPlayer */
window.GTA_onPlayerMorto = function() {
    GTA_health = 0;
    atualizarHUD();
    mostrarNotificacao('VOCE MORREU');
    setTimeout(function() {
        GTA_health = 5;
        atualizarHUD();
        if (window.GTA && GTA._revivePlayer) GTA._revivePlayer();
        mostrarNotificacao('RESPAWN');
    }, 3500);
};

/* Mortes (tiro/atropelamento) geram procurado — chamado por ai.js GTA._killPed */
var GTA_mortes = 0;
window.GTA_registrarMorte = function(cause) {
    GTA_mortes++;
    // A cada 4 mortes sobe 1 estrela (1a morte ja deixa procurado)
    if (GTA_mortes % 4 === 1) {
        GTA_procurado = Math.min(5, GTA_procurado + 1);
        GTA_timerFuga = 0;
        mostrarNotificacao(GTA_procurado === 1 ? 'POLICIA ALERTADA!' : 'PROCURADO +1');
    }
    atualizarHUD();
};

/* ââ Sistema de procurado (3 carros em 2 min = 1 estrela) âââââ */
var GTA_roubosCarros = [];   // timestamps (ms) dos roubos
var GTA_timerFuga    = 0;    // segundos fora do carro sem crime
var GTA_ultimoT      = performance.now();
var GTA_sireneLig    = false;

function registrarRoubo() {
    var agora = Date.now();
    var limite = 2 * 60 * 1000; // 2 minutos em ms
    GTA_roubosCarros.push(agora);
    // Remove roubos mais antigos que 2 min
    GTA_roubosCarros = GTA_roubosCarros.filter(function(t){ return agora - t < limite; });

    if (GTA_roubosCarros.length === 3) {
        // Terceiro roubo em 2 min: ganha 1 estrela
        GTA_procurado = Math.min(5, GTA_procurado + 1);
        GTA_timerFuga = 0;
        mostrarNotificacao('POLICIA AVISO!');
        atualizarHUD();
    } else if (GTA_roubosCarros.length > 3) {
        // Cada roubo adicional enquanto procurado: mais 1 estrela
        GTA_procurado = Math.min(5, GTA_procurado + 1);
        GTA_timerFuga = 0;
        atualizarHUD();
    }
}

function loopProcurado() {
    var agora = performance.now();
    var delta = (agora - GTA_ultimoT) / 1000;
    GTA_ultimoT = agora;

    if (GTA_procurado > 0) {
        var p = getPlayer();
        var noVeiculo = p && p.inCar;
        if (!noVeiculo) {
            GTA_timerFuga += delta;
            // Quanto mais estrelas, mais tempo pra sumir (25s, 35s, 45s, 55s, 65s)
            var tempoDecair = 15 + GTA_procurado * 10;
            if (GTA_timerFuga >= tempoDecair) {
                GTA_timerFuga = 0;
                GTA_procurado = Math.max(0, GTA_procurado - 1);
                atualizarHUD();
                if (GTA_procurado === 0) mostrarNotificacao('FORA DE PERIGO');
            }
        } else {
            // No carro e procurado: reseta timer de fuga
            GTA_timerFuga = 0;
        }
    }
    requestAnimationFrame(loopProcurado);
}

/* ââ Callbacks de entrar/sair do carro âââââââââââââââââââââââ */
window.GTA_onEnterCar = function(carro) {
    registrarRoubo();
    // Sem dinheiro por dirigir - dinheiro vem sÃ³ de missoes/roubos
};
window.GTA_onExitCar = function() {
    if (GTA_sireneLig) toggleSirene();
};

/* ââ Notificacao flutuante ââââââââââââââââââââââââââââââââââââ */
var _notificTimer = null;
function mostrarNotificacao(txt) {
    var el = document.getElementById('_notific');
    if (!el) return;
    el.textContent = txt;
    el.style.display = 'block';
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = 'notificFade 2.5s ease-out forwards';
    if (_notificTimer) clearTimeout(_notificTimer);
    _notificTimer = setTimeout(function(){ el.style.display = 'none'; }, 2600);
}

/* ââ Sistema de arma (inspirado em ArmouryPlayer.cs + Weapon.cs) ââ */
// weapon 0 = sem arma, 1 = pistola .38, 2 = metralhadora
// Municao finita: pistola pickup = 30, MG pickup = 50
// Rate of fire: pistola = 1 tiro/0.4s, MG = 10 tiros/s

var _flashTimer       = null;
var _metralhaTimer    = null;
var _metralhaHold     = false;

function mostrarFlash() {
    var flash = document.getElementById('_flash');
    if (!flash) return;
    flash.style.display = 'block';
    flash.style.animation = 'none';
    flash.offsetHeight;
    flash.style.animation = 'flashTiro 0.12s ease-out forwards';
    if (_flashTimer) clearTimeout(_flashTimer);
    _flashTimer = setTimeout(function(){ flash.style.display = 'none'; }, 150);
}

function dispararArma() {
    var p = getPlayer();
    if (!p || p.inCar) return;
    var w = p.weapon || 0;
    if (w === 0) return; // sem arma

    // Verificar municao (como Weapon.cs: if (currentAmmoMagazines < 1) return)
    if (GTA_ammo[w] !== undefined && GTA_ammo[w] <= 0) {
        // Sem municao â remove arma (como ArmouryPlayer: SetWeaponIndexZero)
        p.weapon = 0;
        mostrarNotificacao('SEM MUNICAO');
        atualizarHUD();
        return;
    }

    // Consumir municao (como Weapon.cs: DecreaseAmmo(1))
    if (GTA_ammo[w] !== undefined) {
        GTA_ammo[w]--;
        if (GTA_ammo[w] < 0) GTA_ammo[w] = 0;
    }

    mostrarFlash();
    atualizarHUD();
    // Projetil de verdade (hitscan + tracer + dano a peds/carros) em ai.js
    if (window.GTA && GTA.fireBullet) GTA.fireBullet();
}

// Cadencia por arma (ms entre tiros): pistola ~3 tiros/s, metralhadora 10 tiros/s
function _cadenciaArma(w) { return w === 2 ? 100 : 320; }

// Fogo continuo enquanto o botao/tecla estiver pressionado, ate acabar a municao.
// Vale para as DUAS armas (igual ao GTA original: segura e nao para de atirar).
function iniciarFogo() {
    if (_metralhaHold) return;
    var p = getPlayer();
    if (!p || p.inCar || !p.weapon) return;
    _metralhaHold = true;
    function tiro() {
        if (!_metralhaHold) return;
        dispararArma();
        var pp = getPlayer();
        // Para se trocou de arma / ficou sem municao (dispararArma zera weapon)
        if (!pp || !pp.weapon || pp.inCar) { pararFogo(); return; }
        _metralhaTimer = setTimeout(tiro, _cadenciaArma(pp.weapon));
    }
    tiro();
}

function pararFogo() {
    _metralhaHold = false;
    if (_metralhaTimer) clearTimeout(_metralhaTimer);
    _metralhaTimer = null;
}

function acaoBotaoPress() {
    var p = getPlayer();
    if (!p) return;
    if (p.inCar) {
        toggleSirene();
    } else if (p.weapon) {
        iniciarFogo(); // pistola e metralhadora: segura = atira sem parar
    }
    // sem arma (weapon 0): soco (nao faz nada visivel por agora)
}

function acaoBotaoRelease() {
    pararFogo();
}

/* ââ Ciclar arma (como ArmouryPlayer.cs: NextWeapon) âââââââââââ */
function ciclarArma() {
    var p = getPlayer();
    if (!p || p.inCar) return;
    // Lista de armas disponiveis (com municao)
    var disponiveis = [0]; // sempre tem "sem arma"
    if (GTA_ammo[1] > 0) disponiveis.push(1);
    if (GTA_ammo[2] > 0) disponiveis.push(2);

    var idx = disponiveis.indexOf(p.weapon);
    idx = (idx + 1) % disponiveis.length;
    p.weapon = disponiveis[idx];

    if (p.weapon > 0) {
        mostrarNotificacao(NOMES_ARMA[p.weapon]);
    }
    atualizarHUD();
}

// Expoe globals para player.js acessar via keydown
window.GTA_cycleWeapon = ciclarArma;

// Atirar via teclado (F key hold)
var _fKeyHold = false;
var _fKeyTimer = null;
window.GTA_atirarTeclado = function(pressed) {
    var p = getPlayer();
    if (!p || p.inCar) return;
    if (pressed) {
        if (p.weapon) iniciarFogo(); // segura F = atira sem parar (pistola e metralhadora)
    } else {
        pararFogo();
    }
};

/* ââ Sirene âââââââââââââââââââââââââââââââââââââââââââââââââââ */

/* ââ Pickups de armas âââââââââââââââââââââââââââââââââââââââââââ */
// Pistola .38 = wireframe CIANO (weapon 1)
// Metralhadora = wireframe AMARELO (weapon 2)
var GTA_pickups = [];

// 8 posicoes de pistola .38 nas calcadas (player nasce em Three.js 6720,-7616)
// Player nasce em Three.js (512, -192) [GTA.Debug.startPosition=[8,3,2]]
var GTA_PICKUP_38_POS = [
    {x: 448, y: -140},   // calcada norte-oeste
    {x: 512, y: -140},   // calcada norte-centro
    {x: 576, y: -140},   // calcada norte-leste
    {x: 416, y: -210},   // calcada oeste
    {x: 608, y: -210},   // calcada leste
    {x: 448, y: -270},   // calcada sul-oeste
    {x: 512, y: -270},   // calcada sul-centro
    {x: 576, y: -270},   // calcada sul-leste
];

// 8 posicoes de metralhadora (mais afastadas / estrategicas)
var GTA_PICKUP_MG_POS = [
    {x: 480, y: -155},   // calcada norte proxima
    {x: 544, y: -155},   // calcada norte proxima leste
    {x: 432, y: -230},   // calcada oeste media
    {x: 592, y: -230},   // calcada leste media
    {x: 432, y: -250},   // calcada oeste sul
    {x: 592, y: -250},   // calcada leste sul
    {x: 470, y: -300},   // calcada sul proxima
    {x: 554, y: -300},   // calcada sul leste
];

function criarPickups(game) {
    if (!game || !game.scene) return;
    GTA_pickups = [];
    var GeomClass = (typeof THREE !== 'undefined') && (THREE.BoxGeometry || THREE.CubeGeometry);
    if (!GeomClass) return;

    // Pistolas .38 â caixa ciano
    GTA_PICKUP_38_POS.forEach(function(pos) {
        try {
            var geom = new GeomClass(7, 7, 7);
            var mat  = new THREE.MeshBasicMaterial({ color: 0x00ccff, wireframe: true });
            var mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(pos.x, pos.y, 15);
            game.scene.add(mesh);
            GTA_pickups.push({ mesh: mesh, pos: pos, ativa: true, tipo: 1 });
        } catch(e) { GTA.Log('Pickup .38 error: ' + e.message); }
    });

    // Metralhadoras â caixa amarela (maior)
    GTA_PICKUP_MG_POS.forEach(function(pos) {
        try {
            var geom = new GeomClass(9, 9, 9);
            var mat  = new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true });
            var mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(pos.x, pos.y, 15);
            game.scene.add(mesh);
            GTA_pickups.push({ mesh: mesh, pos: pos, ativa: true, tipo: 2 });
        } catch(e) { GTA.Log('Pickup MG error: ' + e.message); }
    });
}

function loopPickups() {
    var p = getPlayer();
    var t = Date.now() * 0.003;
    GTA_pickups.forEach(function(pk) {
        if (!pk.ativa) return;
        pk.mesh.rotation.x += 0.04;
        pk.mesh.rotation.z += 0.03;
        pk.mesh.position.z  = 8 + Math.sin(t + pk.pos.x * 0.01) * 3;

        if (!p) return;
        var dx   = p.position.x - pk.pos.x;
        var dy   = p.position.y - pk.pos.y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 18) {
            pk.ativa = false;
            if (window._gtaGame) window._gtaGame.scene.remove(pk.mesh);
            // Adiciona municao (como ArmouryPlayer.cs: IncreaseAmmoMagazine)
            // Pistola .38 = +30 balas, Metralhadora = +50 balas
            var ammoGain = pk.tipo === 2 ? 50 : 30;
            GTA_ammo[pk.tipo] = Math.min(99, (GTA_ammo[pk.tipo] || 0) + ammoGain);
            // Equipa a arma recolhida se nao tinha arma
            if (!p.weapon || p.weapon === 0) {
                p.weapon = pk.tipo;
            }
            mostrarNotificacao(pk.tipo === 2 ? 'METRALHADORA +50' : 'PISTOLA .38 +30');
            atualizarHUD();
        }
    });
    requestAnimationFrame(loopPickups);
}

/* ââ Botao JOGAR ââââââââââââââââââââââââââââââââââââââââââââââ */
// Personagens distintos por COR (tint no material clonado do player; nao afeta peds).
var GTA_chars = [

];

(function montarCards() {
    var cont = document.getElementById('_csCards');

            '<div style="width:32px;height:32px;border-radius:50%;background:' + c.cor + ';"></div>' +

            '<div style="color:#ccc;font-size:11px;letter-spacing:1px;">' + c.nome + '</div>';

})();

function escolherPersonagem(i) {
    GTA_charPick = i;
    for (var k = 0; k < GTA_chars.length; k++) {
        var card = document.getElementById('_csCard' + k);
        if (card) {
            card.style.borderColor = (k === i) ? '#fff' : 'transparent';
            card.style.transform   = (k === i) ? 'scale(1.08)' : 'scale(1)';
        }
    }
    _csAtualizarBtn();
}

// Barra de progresso: o loader chama window.GTA_onLoadProgress no build do mapa
window.GTA_onLoadProgress = function (pct) {
    var b  = document.getElementById('_csBar');   if (b)  b.style.width = pct + '%';
    var t  = document.getElementById('_csPct');   if (t)  t.textContent = 'Carregando mapa... ' + pct + '%';
    var b2 = document.getElementById('_loadBar'); if (b2) { b2.style.animation = 'none'; b2.style.width = pct + '%'; }
};

function _csAtualizarBtn() {
    var btn = document.getElementById('_csStart'); if (!btn) return;
    var pronto = (GTA_charPick !== null) && GTA_loadDone;
    btn.disabled = !pronto;
    btn.style.opacity = pronto ? '1' : '0.4';
    btn.style.cursor  = pronto ? 'pointer' : 'default';
    btn.textContent   = pronto ? 'COMECAR' : (GTA_charPick === null ? 'ESCOLHA UM PERSONAGEM' : 'CARREGANDO...');
}

function iniciarJogo() {
    document.getElementById('_menu').style.display       = 'none';
    document.getElementById('_loading').style.display    = 'none';
    document.getElementById('_charSelect').style.display = 'flex';
    document.getElementById('mc').style.display          = 'block'; // canvas renderiza atras do overlay
    start();          // dispara o carregamento do mapa EM SEGUNDO PLANO
    loopProcurado();
    _csAtualizarBtn();
    (function esperaLoad() {   // libera o COMECAR quando o player nasce (load pronto)
        var g = window._gtaGame;
        if (g && g.player) { GTA_loadDone = true; _csAtualizarBtn(); return; }
        setTimeout(esperaLoad, 250);
    })();
}

function aplicarPersonagem(hex) {
    // Reaplica algumas vezes no inicio: o material e compartilhado com peds, entao
    // clonamos so o do player; reaplicar evita perder o tint se algo recriar o sprite.
    var tentativas = 0;
    (function ap() {
        var g = window._gtaGame;
        if (g && g.player && g.player.sprite && g.player.sprite.material) {
            try {
                var spr = g.player.sprite;
                // MeshBasicMaterial nao tem .clone() neste build -> material novo com a mesma textura
                if (!spr._charMatCloned) { spr.material = new THREE.MeshBasicMaterial({ map: spr.material.map, transparent: true }); spr._charMatCloned = true; }
                spr.material.color.setHex(hex);
                spr.material.depthTest = false; // player sempre na frente
            } catch (e) {}
        }
        if (tentativas++ < 6) setTimeout(ap, 250);
    })();
}

function comecarJogo() {
    if (GTA_charPick === null || !GTA_loadDone) return;
    aplicarPersonagem(GTA_chars[GTA_charPick].hex);
    document.getElementById('_charSelect').style.display = 'none';
    document.getElementById('_hud').style.display        = 'block';
    atualizarHUD();
    try { criarPickups(window._gtaGame); loopPickups(); } catch (e) {}
}

/* ââ Joystick âââââââââââââââââââââââââââââââââââââââââââââââââ */
var jAtivo=false, jBX=0, jBY=0, JR=54;
var jbase = document.getElementById('jbase');
var thumb  = document.getElementById('jthumb');

jbase.addEventListener('touchstart',function(e){
    e.preventDefault(); jAtivo=true;
    var t=e.touches[0], br=jbase.getBoundingClientRect();
    jBX=br.left+br.width/2; jBY=br.top+br.height/2;
    moverJoy(t.clientX,t.clientY);
},{passive:false});
jbase.addEventListener('touchmove',function(e){
    e.preventDefault(); if(!jAtivo)return;
    moverJoy(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
jbase.addEventListener('touchend',function(e){
    e.preventDefault(); jAtivo=false;
    thumb.style.transform='translate(-50%,-50%)';
    liberarMovimento();
},{passive:false});

function moverJoy(cx,cy){
    var dx=cx-jBX, dy=cy-jBY;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>JR){dx=dx/dist*JR; dy=dy/dist*JR;}
    thumb.style.transform='translate(calc(-50% + '+Math.round(dx)+'px),calc(-50% + '+Math.round(dy)+'px))';
    var th=JR*0.3;
    setMove('moveForward',  dy < -th);
    setMove('moveBackward', dy >  th);
    setMove('turnLeft',     dx < -th);
    setMove('turnRight',    dx >  th);
}
